<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <header>
        <h1>
            Lists
        </h1>
    </header>

    <main>

        <ol>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
        <br><br>
        <ol start="50">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
        <br>
        <ol reversed start="53">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
        <br><br>
        <ul>
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ul>

        <br><br>

        <dl>
            <dt>Coffee</dt>
            <dd>Hot Black Drink</dd>
            <dt>Tea</dt>
            <dd>Hot Drink</dd>
            <dl>Milk</dl>
            <dd>Cold White Drink</dd>
        </dl>

    </main>

</body>

</html>
